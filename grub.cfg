# AION OS GRUB Configuration
# Default boot configuration

set default=0
set timeout=5

menuentry "AION OS - AI-Powered Operating System" {
    insmod part_msdos
    insmod ext2
    set root='(cd0,1)'
    multiboot2 /boot/aion.bin
    boot
}

menuentry "AION OS - Debug Mode" {
    insmod part_msdos
    insmod ext2
    set root='(cd0,1)'
    multiboot2 /boot/aion.bin debug
    boot
}